name: 每日早报手动推送

on:
  # 仅支持手动触发（回复1触发）
  workflow_dispatch:
  # push时也运行一次测试
  push:
    branches:
      - main

jobs:
  daily-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
      
      - name: 运行主程序
        env:
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
        run: |
          cd src
          python main.py
